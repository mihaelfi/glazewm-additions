[package]
name = "glaze-supervisor"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "GlazeSupervisor"
path = "main.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
opt-level = "s"
