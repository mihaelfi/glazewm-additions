[package]
name = "glaze-index"
version = "0.1.0"
edition = "2024"

# The file index service (docs/indexer.md). Plain Win32 calls; serde for the JSON settings and requests.
[[bin]]
name = "GlazeIndex"
path = "src/main.rs"

# The measuring prototype it grew from; standalone, kept for re-measuring.
[[bin]]
name = "index-probe"
path = "src/probe.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
strip = true
